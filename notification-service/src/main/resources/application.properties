spring.application.name=notification-service

server.port=8500

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# No real SMTP server is ever configured here on purpose (see NotificationEmailSender) - this
# points at a harmless localhost placeholder that simply won't have anything listening in a
# normal local run (the completion email is best-effort, not a gate on saga completion). Tests
# override these to point at GreenMail, a fake SMTP server, to exercise the real sending code.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Kafka - see docker-compose.yml for local infra; Testcontainers Kafka is used in tests instead.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.investorbook.common.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# health/info/metrics reachable without a bearer token - this service has no HTTP business
# endpoints of its own to protect (it only reacts to Kafka events), so nothing else needs a
# SecurityConfiguration here.
management.endpoints.web.exposure.include=health,info,metrics
