spring.application.name=invoice-service

server.port=8400

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka - see docker-compose.yml for local infra; Testcontainers Kafka is used in tests instead.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=invoice-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.investorbook.common.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# health/info/metrics reachable without a bearer token - this service has no HTTP business
# endpoints of its own to protect (it only reacts to Kafka events), so nothing else needs a
# SecurityConfiguration here.
management.endpoints.web.exposure.include=health,info,metrics
