spring.application.name=order-service

server.port=8200

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.oauth2.resource.filter-order=3
# Demo keypair below, overridable via env var for a real deployment (see the README's note on
# wiring this to a real secrets manager) - the fallback after the ':' is this repo's long-standing
# dev-only public key, unchanged from the other services.
security.oauth2.resource.jwt.key-value=${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

# Kafka - see docker-compose.yml for local infra; Testcontainers Kafka is used in tests instead.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.investorbook.common.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics
