spring.application.name=order-service

server.port=8200

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#register by IP instead of this machine's hostname - on Windows the auto-detected hostname
#(e.g. *.mshome.net from the Mobile Hotspot/Hyper-V default switch) often isn't resolvable via
#DNS, which makes every other service's server-to-server call fail with an UnknownHostException
#even though Eureka itself reports the instance as UP
eureka.instance.prefer-ip-address=true

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Demo keypair below, overridable via env var for a real deployment (see the README's note on
# wiring this to a real secrets manager) - the fallback after the ':' is this repo's long-standing
# dev-only public key, unchanged from the other services.
investorbook.security.jwt.public.key=${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

# Kafka - see docker-compose.yml for local infra; Testcontainers Kafka is used in tests instead.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.investorbook.common.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Traces and logs go to the LGTM container over OTLP (Boot 4 has no default endpoint, so they must be set). Metrics stay on
# the Prometheus scrape, so OTLP metrics export is off to avoid publishing them twice.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.enabled=false
management.observations.enable.spring.security=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Caps GET /orders?size=... regardless of what a client requests (default is 2000) - see
# OrderController.listOrders. Spring Data Web resolves the Pageable parameter and applies this
# itself; no manual clamping code needed.
spring.data.web.pageable.max-page-size=100
