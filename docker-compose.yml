# Local infrastructure for the event-driven purchase flow (order/payment/invoice/
# notification-service). Everything else in this repo (Postgres, the services
# themselves) still runs the way CLAUDE.md documents - via `mvn spring-boot:run`
# against a locally-installed Postgres - so this compose file deliberately only
# covers the infrastructure that doesn't exist locally yet: Kafka, Prometheus, and Grafana LGTM.
# Tests never depend on this - they use Testcontainers Kafka instead, started and
# torn down per test run.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: investorbook-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode - no separate Zookeeper needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Metrics UI at http://localhost:9090 (Status > Targets shows which services are up).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: investorbook-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana, Tempo (traces), Loki (logs) and an OpenTelemetry collector in one container.
  # Grafana UI at http://localhost:3000 (admin / admin); services send OTLP to :4318.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    container_name: investorbook-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/investorbook-prometheus.yaml:ro
    depends_on:
      - prometheus
