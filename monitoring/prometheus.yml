# Scrapes every service's /actuator/prometheus. Services run on the host (mvn spring-boot:run),
# Prometheus runs in Docker, hence host.docker.internal rather than localhost.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]

  # auth-service is the only service with a context path (/uaa).
  - job_name: auth-service
    metrics_path: /uaa/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8765"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8200"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8300"]

  - job_name: invoice-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8400"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8500"]
