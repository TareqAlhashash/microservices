spring.application.name=api-gateway

server.port=8765
spring.profiles=default
#address of the naming server to be able to register/discover other micro services
eureka.client.service-url.default-zone=http://localhost:8761


# allow the Authorization header so microservices can receive the JWT token
zuul.sensitiveHeaders=

security.oauth2.resource.jwt.keyValue=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----

# basic auth to be able to submit user/pass to auth service
investorbook.security.html5.jwt.client.id=html5
investorbook.security.html5.jwt.client.secret=html5secretpass123

