spring.application.name=api-gateway

server.port=8765
spring.profiles=default
#address of the naming server to be able to register/discover other micro services
eureka.client.service-url.default-zone=http://localhost:8761


# allow the Authorization header so microservices can receive the JWT token
zuul.sensitiveHeaders=

# Demo keypair/secret below, overridable via env vars for a real deployment (see the README's
# note on wiring these to a real secrets manager) - the fallback after the ':' is this repo's
# long-standing dev-only public key, unchanged from before this was externalised.
security.oauth2.resource.jwt.keyValue=${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

# basic auth to be able to submit user/pass to auth service
investorbook.security.html5.jwt.client.id=html5
investorbook.security.html5.jwt.client.secret=${HTML5_CLIENT_SECRET:html5secretpass123}

#logging.level.org.springframework.security=DEBUG

#member service upload pic could take some time
member-service.ribbon.ReadTimeout=5000

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics

