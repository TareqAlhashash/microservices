spring.application.name=api-gateway

server.port=8765
#address of the naming server to be able to register/discover other micro services
eureka.client.service-url.default-zone=http://localhost:8761

# Gateway's own Netty client response timeout for proxied calls (global, not per-route - a real
# deployment might want this tuned per route instead).
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# Demo keypair below, overridable via env vars for a real deployment (see the README's note on
# wiring these to a real secrets manager) - the fallback after the ':' is this repo's long-
# standing dev-only public key, unchanged from before this was externalised. Renamed from the old
# security.oauth2.resource.jwt.keyValue (that property name was specific to the legacy
# spring-cloud-starter-oauth2 auto-configuration this module no longer uses) to
# investorbook.security.jwt.public.key, matching the name every other resource-server-side
# service in this repo already uses.
investorbook.security.jwt.public.key=${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

#logging.level.org.springframework.security=DEBUG

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics

# origins allowed to call this gateway from a browser (see CorsConfig) - the React storefront's
# Vite dev server by default; comma-separate multiple origins for a real deployment.
investorbook.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# per-client-IP requests/sec allowed through the gateway before RateLimitFilter returns 429 -
# see its Javadoc for what "per-client" and "in-memory" mean here.
investorbook.security.rate-limit.requests-per-second=${RATE_LIMIT_REQUESTS_PER_SECOND:20}
