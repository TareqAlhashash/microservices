spring.application.name=auth-service


server.port=9100

server.servlet.context-path=/uaa

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

# Demo keypair/secrets below, overridable via env vars for a real deployment (see the README's
# note on wiring these to a real secrets manager instead) - the fallback after the ':' is this
# repo's long-standing dev-only keypair, unchanged from before this was externalised.
investorbook.security.jwt.public.key=${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}
investorbook.security.jwt.private.key=${JWT_PRIVATE_KEY:-----BEGIN RSA PRIVATE KEY----------END RSA PRIVATE KEY-----}

investorbook.security.html5.jwt.client.id=html5

# BCrypt hash of the html5 client secret (matches api-gateway's plaintext HTML5_CLIENT_SECRET) -
# not reversible from this value alone, so no plaintext comment needed here.
investorbook.security.html5.jwt.client.secret=${HTML5_CLIENT_SECRET_HASH:$2a$10$UDpOBf6eXtZcC2ix9DXJEuIGJXd0unhLoPw82JfK5ftYEnE.mxP1i}

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics
