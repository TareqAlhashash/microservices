spring.application.name=auth-service


server.port=9100

server.servlet.context-path=/uaa

#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#register by IP instead of this machine's hostname - on Windows the auto-detected hostname
#(e.g. *.mshome.net from the Mobile Hotspot/Hyper-V default switch) often isn't resolvable via
#DNS, which makes every other service's server-to-server call fail with an UnknownHostException
#even though Eureka itself reports the instance as UP
eureka.instance.prefer-ip-address=true

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

# Demo signing key below, overridable via env vars for a real deployment (see the README's note
# on wiring these to a real secrets manager instead) - the fallback after the ':' is this repo's
# long-standing dev-only private key. PKCS#8 ("BEGIN PRIVATE KEY"), not the PKCS#1
# ("BEGIN RSA PRIVATE KEY") form this used to be in - java.security.KeyFactory (which PemRsaKeys
# uses) has no built-in PKCS#1 parser - reformatted with `openssl pkcs8 -topk8`, same key
# material. Only the private key lives here: this service only signs, never verifies, so it has
# no need of the public half every other service already carries its own copy of.
investorbook.security.jwt.private.key=${JWT_PRIVATE_KEY:-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----}

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
