

spring.application.name=eureka-server

server.port=8761

#dont register self as client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# health/info/metrics reachable without a bearer token, same as every other service - this
# module has no SecurityConfiguration of its own, so nothing was ever gating it, but the
# property is now set explicitly here too for consistency with the rest of the repo.
management.endpoints.web.exposure.include=health,info,metrics


