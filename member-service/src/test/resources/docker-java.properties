# Testcontainers 1.19's bundled docker-java defaults to Docker API 1.32 for its
# initial connectivity probe. Docker Engine 29+ rejects anything below 1.40
# with a 400 (client version too old), which surfaces as "Could not find a
# valid Docker environment" rather than a version mismatch. Pinning this here
# (an env var / surefire-passed system property does not reach this check) is
# the documented fix.
api.version=1.44
