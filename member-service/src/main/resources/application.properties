
spring.application.name=member-service


server.port=8100


#address of the naming server to be able to register/discover other microservices
eureka.client.service-url.default-zone=http://localhost:8761

#postgresql
spring.datasource.url=jdbc:postgresql://localhost/investorbook
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.oauth2.resource.filter-order = 3
# Demo keypair below, overridable via env var for a real deployment (see the README's note on
# wiring this to a real secrets manager) - the fallback after the ':' is this repo's long-standing
# dev-only public key, unchanged from before this was externalised.
security.oauth2.resource.jwt.key-value = ${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----}

# signup's callback into api-gateway/auth-service (AuthenticationServiceClient) - fail fast
# rather than let a slow/unavailable auth path hang the whole signup request.
feign.client.config.api-gateway.connectTimeout=2000
feign.client.config.api-gateway.readTimeout=2000

# Trips after 4 consecutive/majority failures in a 4-call window, so a genuinely down
# auth-service degrades signup (202 + no token, see AuthenticationServiceClient) instead of
# retrying a dead dependency on every request.
resilience4j.circuitbreaker.instances.authenticationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authenticationService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.authenticationService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.authenticationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authenticationService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.authenticationService.permittedNumberOfCallsInHalfOpenState=2

# health/info/metrics reachable without a bearer token (see SecurityConfiguration) - a real
# deployment would put these on a separate management port/network instead.
management.endpoints.web.exposure.include=health,info,metrics
